[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "razorpayx-agentic-commerce"
version = "0.1.0"
description = "Autonomous Shopping Agent with AP2 Mandates, Deterministic Policy, and Razorpay Test Mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.24",
    "ap2>=0.1.1",
    "google-adk>=1.28.0",
    "fastmcp>=2.1.0",
    "mcp>=1.2.0",
    "cryptography>=43.0.0",
    "jwcrypto>=1.5.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "razorpay>=1.4.1",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]